name: CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m py_compile app.py database.py agente_v2.py sensor_simulador.py
