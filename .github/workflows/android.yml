name: NexoCampo (Android)
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar o APK
        run: gradle --no-daemon assembleRelease
      - name: Nome do arquivo
        run: cp app/build/outputs/apk/release/app-release.apk "nexocampo-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nexocampo-apk
          path: android/nexocampo-*.apk
          retention-days: 30
